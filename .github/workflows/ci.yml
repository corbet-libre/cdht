name: ci
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: 2
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - name: Current stable Rust
      run: 'rustup update stable --no-self-update

        rustup default stable

        rustc --version

        '
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        key: veilid-dd8e2cdd
        cache-directories: target/veilid-oracle
    - name: Generate upstream vectors and compare every byte
      run: ci/veilid-vectors.sh
    - name: Preserve vectors and dependency identities
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: veilid-conformance
        path: 'target/veilid-vectors.json

          target/veilid-Cargo.lock

          Cargo.lock

          '
        if-no-files-found: error
    needs:
    - resolve
    - check
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - name: Toolchain (current stable)
      run: 'rustup update stable --no-self-update

        rustup default stable

        rustup component add rustfmt clippy

        rustup target add wasm32-unknown-unknown

        '
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy (native, all targets)
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test
      run: cargo test --locked
    - name: Clippy (wasm32, browser build)
      run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
    - name: Install matching wasm runner
      run: 'cargo metadata --locked --format-version 1 > dependency-metadata.json

        version=$(jq -r ''.packages[] | select(.name == "wasm-bindgen") | .version'' dependency-metadata.json)

        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"

        base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"

        mkdir -p "$RUNNER_TEMP/wasm-runner"

        cd "$RUNNER_TEMP/wasm-runner"

        curl -A ''transport-ci/1.0'' --fail --location --retry 3 --remote-name "$base/$archive"

        curl -A ''transport-ci/1.0'' --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"

        checksum=$(cut -d '' '' -f1 "$archive.sha256sum")

        printf ''%s  %s\n'' "$checksum" "$archive" | sha256sum --check

        tar -xzf "$archive" --strip-components=1

        echo "$PWD" >> "$GITHUB_PATH"

        '
    - name: Execute actual Wasm records, queues, network and sync vectors
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      run: cargo test --locked --target wasm32-unknown-unknown --test records --test network --test adversarial
        --test sync --test rpc
    needs:
    - resolve
  dependency-policy:
    needs:
    - resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
  coverage:
    needs:
    - resolve
    - check
    - conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: 'rustc --version

        cargo llvm-cov --version'
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex '/tests/|/veilid_capnp.rs$' --json --output-path coverage.json
    - name: Export source coverage from the same execution
      run: 'cargo llvm-cov report --branch --ignore-filename-regex ''/tests/|/veilid_capnp.rs$'' --lcov --output-path
        coverage.lcov

        cargo llvm-cov report --branch --ignore-filename-regex ''/tests/|/veilid_capnp.rs$'' --text --output-path
        coverage.txt'
    - name: Require complete line and branch coverage
      run: python3 .github/check-source-coverage.py coverage.lcov coverage.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          Cargo.lock

          resolver.txt

          coverage.lcov

          coverage.txt'
        retention-days: 7
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
